{% extends 'base.html' %}{% block title %}Регистрация — PizzaPoint{% endblock %}{% block content %}<div class="auth-wrap"><div class="eyebrow">СОЗДАНИЕ АККАУНТА</div><h1>Регистрация</h1><p class="form-lead">Заполни данные, чтобы создать профиль и пользоваться корзиной.</p><form class="product-form" method="post"><label>ФИО<input name="full_name" autocomplete="name" required placeholder="Иванов Иван Иванович"></label><label>Электронная почта<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><label>Номер телефона<input type="tel" name="phone" required placeholder="+79508344521"></label><label>Пароль<input type="password" name="password" minlength="8" required autocomplete="new-password" placeholder="Минимум 8 символов"></label><label>Подтверждение пароля<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password" placeholder="Повтори пароль"></label><button class="button primary full">Зарегистрироваться</button><p class="auth-note">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p></form></div>{% endblock %}
